<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · ShikshaSetu AI</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font: 16px/1.6 system-ui, sans-serif;
        background: #f7fafb;
        color: #23292c;
      }
      main { max-width: 32rem; text-align: center; }
      h1 { font-size: 1.5rem; margin: 0 0 0.75rem; }
      p { margin: 0 0 1rem; color: #566065; }
      button {
        min-height: 44px;
        padding: 0 1.5rem;
        border: 0;
        border-radius: 0.5rem;
        background: #0d7f8c;
        color: #fff;
        font: inherit;
        font-weight: 600;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #141a1d; color: #eef2f3; }
        p { color: #a3adb2; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>
        This page has not been saved to the tablet. Screens you have already
        opened will still work. Reconnect to load anything new.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
